servicename: notificationhub
notificationhub:
    notifiers:
        email:
            sender: notifier-nv@mail.ru
            smtp: smtp.mail.ru
            port: 587
    logging:
        service_name: notificationhub
        service_version: 2.0.0
        version: 2.0.0
        level: info
        format: json
        add_source: true
auth_service:
    address: "auth_app:8091"
nats:
    url: nats://nats:4222
    subject: report.>
    event_timeout: 5s
tracing:
    jaeger: jaeger:4318
    switch_on: true