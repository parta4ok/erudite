syntax = "proto3";

package auth;

option go_package = "api/grpc/v1;authv1";

service AuthService {
  rpc Introspect (IntrospectRequest) returns (IntrospectResponse);
  rpc GetLinkedUsers(LinkedID) returns (LinkedUsersResponse);
  rpc GetMentorGroups(MentorID) returns (GroupsResponse);
}

message IntrospectRequest {
  string token = 1;
}

message IntrospectResponse {
    UserClaims claims = 1;
    Error error = 2;
}

message UserClaims {
  string username = 1;
  string issuer = 2;
  repeated string audience = 3;
  string subject = 4;
  repeated string rights = 5;
}

message Error {
  string message = 1;
}

message LinkedID {
	string LinkedID = 1;
}

message MentorID {
	string MentorID = 1;
}

message LinkedUsersResponse {
	UserInfo Recipient = 1;
  	UserInfo Student = 2;
	Error error = 3;
}

message UserInfo {
  string id = 1;
  string username = 2;
  string fullname = 3;
  repeated string rights = 4;
  map<string, string> contacts = 5;
  string group_id = 6;
}

message Student {
	string id = 1;
	string name = 2;
	string fullname = 3;
}

message Group {
	string id = 1;
	string name = 2;
	repeated Student students = 3;
}

message GroupsResponse {
	repeated Group groups = 1;
	Error error = 2;
}
