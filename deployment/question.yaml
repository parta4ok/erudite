kvs:
    http:
        public:
            port: :8080
            timeout: 5s
        private:
            port: :8081
            timeout: 5s
    storage:
        type: postgres
    logging:
        service_name: question
        service_version: 1.0.0
        version: 1.0.0
        level: info
        format: json
        add_source: true
    session:
        time_to_respond: 1m
        day_session_limit: 1
    sheduler:
        publisher:
            interval: 2s
        flusher:
            interval: 1m
postgres:
    connection: postgresql://postgres:password@postgres:5432/knowledge
auth_service:
    address: "auth_app:8091"
nats:
    url: nats://nats:4222
    subject: sessions.result
    event_timeout: 5s
tracing:
    system: otel
    servicename: question
    enabled: false
otel:
    endpoint: jaeger:4317
    insecure: true
jaeger:
    address: jaeger:6831
    probability: 1.0
