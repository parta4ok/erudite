syntax = "proto3";

package auth;

option go_package = "api/grpc/v1;authv1";

service AuthService {
  rpc Introspect (IntrospectRequest) returns (IntrospectResponse);
  rpc GetLinkedUser(LinkedID) returns (UserInfoResponse);
}

message IntrospectRequest {
  string token = 1;
}

message IntrospectResponse {
    UserClaims claims = 1;
    Error error = 2;
}

message UserClaims {
  string username = 1;
  string issuer = 2;
  repeated string audience = 3;
  string subject = 4;
  repeated string rights = 5;
}

message Error {
  string message = 1;
}

message LinkedID {
	string LinkedID = 1;
}

message UserInfoResponse {
	UserInfo userInfo = 1;
	Error error = 2;
}

message UserInfo {
  string id = 1;
  string username = 2;
  repeated string rights = 3;
  map<string, string> contacts = 4;
  string linkedID = 5;
}
