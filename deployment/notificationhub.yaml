notificationhub:
    notifiers:
        email:
            sender: notifier-nv@mail.ru
            smtp: smtp.mail.ru
            port: 587
    logging:
        service_name: notificationhub
        service_version: 2.0.0
        version: 2.0.0
        level: info
        format: json
        add_source: true
auth_service:
    address: "auth_app:8091"
nats:
    url: nats://nats:4222
    subject: report.>
    event_timeout: 5s
tracing:
    system: otel
    servicename: notificationhub
    enabled: true
otel:
    endpoint: jaeger:4317
    insecure: true
jaeger:
    address: jaeger:6831
    probability: 1.0
