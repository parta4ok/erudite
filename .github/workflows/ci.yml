name: CI Pipeline

on:
    pull_request:
        branches:
            - main

env:
    TEST_PG_CONN: postgresql://postgres:password@localhost:5432/knowledge?sslmode=disable
    TEST_NATS_CONN: nats://localhost:4222

jobs:
    setup-and-lint:
        name: Setup and Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup environment
              uses: ./.github/actions/setup-environment
              with:
                  mail-password: ${{ secrets.MAIL_PASSWORD }}
                  tg-bot-token: ${{ secrets.TG_BOT_TOKEN }}

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: ${{ runner.os }}-go-

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v8
              with:
                  version: v2.4.0

            - name: Run unit tests
              run: go test -v ./...

            - name: Run concurrent test with -race flag
              run: task concurrent_test

    build-services:
        name: Build Services
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup environment
              uses: ./.github/actions/setup-environment
              with:
                  mail-password: ${{ secrets.MAIL_PASSWORD }}
                  tg-bot-token: ${{ secrets.TG_BOT_TOKEN }}

            - name: Build and cache services
              uses: ./.github/actions/build-services

    test-l1:
        name: L1 Tests
        runs-on: ubuntu-latest
        needs: setup-and-lint
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup environment
              uses: ./.github/actions/setup-environment
              with:
                  mail-password: ${{ secrets.MAIL_PASSWORD }}
                  tg-bot-token: ${{ secrets.TG_BOT_TOKEN }}

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: ~/go/pkg/mod
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: ${{ runner.os }}-go-

            - name: Run L1 tests
              run: task l1_test

    test-l2:
        name: L2 Tests
        runs-on: ubuntu-latest
        needs: build-services
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup environment
              uses: ./.github/actions/setup-environment
              with:
                  mail-password: ${{ secrets.MAIL_PASSWORD }}
                  tg-bot-token: ${{ secrets.TG_BOT_TOKEN }}

            - name: Download services images
              uses: actions/download-artifact@v4
              with:
                  name: services-images
                  path: /tmp

            - name: Load services images
              run: docker load < /tmp/services-images.tar.gz

            - name: Run L2 tests
              run: |
                  docker-compose --profile l2 down -v
                  docker-compose --profile l2 up -d
                  task postgres:migrate:up
                  export $(grep -v '^#' .env | xargs) && go test -v -tags=KVS_TEST_L2 ./...
                  docker-compose --profile l2 down -v
