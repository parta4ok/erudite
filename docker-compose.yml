services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: knowledge
        ports:
            - "5432:5432"
        networks:
            - service_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
            interval: 10s
            timeout: 5s
            retries: 5
        profiles:
            - services
            - l1
            - l2

    nats:
        image: nats:2.11.7
        container_name: nats
        command: ["-js", "-sd", "/data"]
        restart: always
        ports:
            - "4222:4222"
        networks:
            - service_network
        healthcheck:
            test: ["CMD", "/nats-server", "--healthz"]
            interval: 10s
            timeout: 5s
            retries: 5
        profiles:
            - services
            - l1
            - l2

    nats-migrations:
        container_name: nats_migrations
        build:
            context: .
            dockerfile: toolkit/nats/migrations/dockerfile
        depends_on:
            nats:
                condition: service_healthy
        environment:
            NATS_URL: nats://nats:4222
            MIGRATION_MODE: up
            LOG_LEVEL: info
        networks:
            - service_network
        restart: "no"
        profiles:
            - services
            - l1
            - l2
    jaeger:
        image: jaegertracing/all-in-one:latest
        container_name: jaeger
        restart: always
        ports:
            - "6831:6831/udp" # Jaeger agent UDP port for spans
            - "6832:6832/udp" # Jaeger agent UDP port for spans
            - "14268:14268" # Jaeger collector HTTP port
            - "16686:16686" # Jaeger UI port
            - "14250:14250" # Jaeger gRPC port
            - "4317:4317" # OTLP gRPC port
            - "4318:4318" # OTLP HTTP port
        environment:
            - COLLECTOR_OTLP_ENABLED=true
            - COLLECTOR_ZIPKIN_HOST_PORT=:9411
        networks:
            - service_network
        healthcheck:
            test: ["CMD", "sh", "-c", "netstat -tuln | grep :14268"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s
        profiles:
            - services
            - l1
            - l2

    question_app:
        image: question-service
        restart: always
        ports:
            - "8080:8080"
            - "8081:8081"
        depends_on:
            postgres:
                condition: service_healthy
            nats:
                condition: service_healthy
            nats-migrations:
                condition: service_completed_successfully
        networks:
            - service_network
        profiles:
            - services
            - l2

    auth_app:
        image: auth-service
        restart: always
        ports:
            - "8091:8091"
            - "8090:8090"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - service_network
        profiles:
            - services
            - l2

    notificationhub_app:
        image: notificationhub-service
        env_file: .env
        restart: always
        depends_on:
            nats:
                condition: service_healthy
            nats-migrations:
                condition: service_completed_successfully
        networks:
            - service_network
        profiles:
            - services
            - l2

    reporting_app:
        image: reporting-service
        env_file: .env
        restart: always
        depends_on:
            nats:
                condition: service_healthy
            nats-migrations:
                condition: service_completed_successfully
        ports:
            - "8070:8070"
        networks:
            - service_network
        profiles:
            - services
            - l2

networks:
    service_network:
        driver: bridge
