version: "3"

tasks:
    lint:
        cmds:
            - golangci-lint run -c ./.golangci.yml ./...

    grpc:generate:
        desc: Generate grpc files
        cmds:
            - protoc --go_out=. --go-grpc_out=. ./api/grpc/v1/auth.proto

    postgres:up:
        desc: Run Postgres service
        cmds:
            - docker-compose up -d postgres

    postgres:restart:
        desc: Restart Postgres service
        cmds:
            - docker-compose restart postgres

    postgres:stop:
        desc: Stop Postgres service
        cmds:
            - docker-compose stop postgres

    postgres:migrate:up:
        desc: Apply all up migrations to Postgres
        cmds:
            - task: postgres:migrate:question:up
            - task: postgres:migrate:auth:up

    postgres:migrate:down:
        desc: Revert all migrations (down) on Postgres
        cmds:
            - task: postgres:migrate:auth:down
            - task: postgres:migrate:question:down

    postgres:migrate:question:up:
        desc: Apply all up migrations of question to Postgres
        cmds:
            - migrate -path question/deploy/migrations/postgres -database "postgresql://postgres:password@localhost:5432/knowledge?sslmode=disable&x-migrations-table=kvs_migrations" up
        silent: true

    postgres:migrate:question:down:
        desc: Revert all migrations (down) of question on Postgres
        cmds:
            - migrate -path question/deploy/migrations/postgres -database "postgresql://postgres:password@localhost:5432/knowledge?sslmode=disable&x-migrations-table=kvs_migrations" down
        silent: true

    postgres:migrate:auth:up:
        desc: Apply all up migrations of auth to Postgres
        cmds:
            - migrate -path auth/deploy/migrations/postgres -database "postgresql://postgres:password@localhost:5432/knowledge?sslmode=disable&x-migrations-table=auth_migrations" up
        silent: true

    postgres:migrate:auth:down:
        desc: Revert all migrations (down) of auth on Postgres
        cmds:
            - migrate -path auth/deploy/migrations/postgres -database "postgresql://postgres:password@localhost:5432/knowledge?sslmode=disable&x-migrations-table=auth_migrations" down
        silent: true

    nats:up:
        desc: Run NATS service
        cmds:
            - docker-compose up -d nats
    nats:restart:
        desc: Restart NATS service
        cmds:
            - docker-compose restart nats
    nats:stop:
        desc: Stop NATS service
        cmds:
            - docker-compose stop nats

    nats:migrate:up:
        desc: Apply all up migrations to NATS
        cmds:
            - docker-compose up -d nats-migrations

    services:build:
        desc: Build all service images
        cmds:
            - docker build --target question -t question-service .
            - docker build --target auth -t auth-service .
            - docker build --target notificationhub -t notificationhub-service .
            - docker build --target reporting -t reporting-service .
            - docker-compose build nats-migrations

    services:run:
        desc: Build & run all services
        cmds:
            - docker-compose --profile services down -v
            - task: services:build
            - docker-compose --profile services up -d
            - task: postgres:migrate:up

    services:down:
        desc: Stop and remove all services containers with volumes
        cmds:
            - docker-compose --profile services down -v

    services:restart:
        desc: Restart services without images rebuilding
        cmds:
            - docker-compose --profile services down -v
            - docker-compose --profile services up -d
            - task: postgres:migrate:up

    l1_test:
        desc: Run L1 test with container infrastructure
        cmds:
            - docker-compose --profile l1 down -v
            - docker-compose --profile l1 up -d
            - task: postgres:migrate:up
            - export $(grep -v '^#' .env | xargs) && go test -v -tags=KVS_TEST_L1 ./...
            - docker-compose --profile l1 down -v

    l2_test:
        desc: Run L2 integration tests with service and container infrastructure
        cmds:
            - docker-compose --profile l2 down -v
            - task: services:build
            - docker-compose --profile l2 up -d
            - task: postgres:migrate:up
            - export $(grep -v '^#' .env | xargs) && go test -v -tags=KVS_TEST_L2 ./...
            - docker-compose --profile l2 down -v

    concurrent_test:
        desc: Run concurrent test with -race flag
        cmds:
            - go test -race -tags=KVS_TEST_CONCURRENT ./...

    swag_gen:
        desc: Generate swagger specification (JSON only)
        cmds:
            - task: swag_gen_question_public
            - task: swag_gen_question_private
            - task: swag_gen_auth
            - task: swag_gen_reporting_public

    run_question_local:
        desc: Run question service locally with local config
        cmds:
            - KVS_CONFIG_PATH=./deployment/question.yaml go run ./question/cmd/question_service/main.go

    run_auth_local:
        desc: Run auth service locally with local config
        cmds:
            - AUTH_CONFIG_PATH=./deployment/auth.yaml go run ./auth/cmd/app/main.go

    run_notificationhub_local:
        desc: Run notificationhub service locally with local config
        cmds:
            - NOTIFICATIONHUB_CONFIG_PATH=./deployment/notificationhub.yaml go run ./notificationhub/cmd/app/main.go

    swag_gen_question_public:
        desc: Generate swagger specification for question service (public port)
        cmds:
            - cd question && swag init -g ./internal/port/http/public/doc.go --output ./internal/port/http/public/ --outputTypes json --parseDependency=false --parseInternal=false --exclude ./internal/port/http/public/
            - mkdir -p api/http/v1/question/public
            - mv question/internal/port/http/public/swagger.json api/http/v1/question/public/

    swag_gen_question_private:
        desc: Generate swagger specification for question service (private port)
        cmds:
            - cd question && swag init -g ./internal/port/http/private/doc.go --output ./internal/port/http/private/ --outputTypes json --parseDependency=false --parseInternal=false --exclude ./internal/port/http/private
            - mkdir -p api/http/v1/question/private
            - mv question/internal/port/http/private/swagger.json api/http/v1/question/private/

    swag_gen_reporting_public:
        desc: Generate swagger specification for reporting service (public port)
        cmds:
            - cd reporting && swag init -g ./internal/port/http/public/doc.go --output ./internal/port/http/public/ --outputTypes json --parseDependency=false --parseInternal=false
            - mkdir -p api/http/v1/reporting/public
            - mv reporting/internal/port/http/public/swagger.json api/http/v1/reporting/public/

    swag_gen_auth:
        desc: Generate swagger specification for auth service
        cmds:
            - cd auth && swag init -g ./internal/port/http/public/doc.go --output ./internal/port/http/public/ --outputTypes json --parseDependency=false --parseInternal=false
            - mkdir -p api/http/v1/auth
            - mv auth/internal/port/http/public/swagger.json api/http/v1/auth/swagger.json
    
    show_logs_reporting:
        desc: Show logs of reporting_service container
        cmds:
            - container_id=$(docker ps | grep reporting | awk '{print $1}'); echo "$container_id"; docker logs "$container_id" --tail=50
    show_logs_question:
        desc: Show logs of question_service container
        cmds:
            - container_id=$(docker ps | grep question | awk '{print $1}'); echo "$container_id"; docker logs "$container_id" --tail=50
    show_logs_auth:
        desc: Show logs of auth_service container
        cmds:
            - container_id=$(docker ps | grep auth | awk '{print $1}'); echo "$container_id"; docker logs "$container_id" --tail=50
    show_logs_notificationhub:
        desc: Show logs of notificationhub_service container
        cmds:
            - container_id=$(docker ps | grep notificationhub | awk '{print $1}'); echo "$container_id"; docker logs "$container_id" --tail=50
