name: 'Build Services'
description: 'Build and cache Docker images for services'
runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: ${{ runner.os }}-buildx-

    - name: Build services
      shell: bash
      run: task services:build

    - name: Save Docker images
      shell: bash
      run: |
        docker save question-service auth-service notificationhub-service | gzip > /tmp/services-images.tar.gz

    - name: Upload services images
      uses: actions/upload-artifact@v4
      with:
        name: services-images
        path: /tmp/services-images.tar.gz
        retention-days: 1